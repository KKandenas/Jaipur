name: JaipurApp
options:
  bundleIdPrefix: com.kkandenas
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

packages:
  JaipurKit:
    path: ../JaipurKit
  # Firebase iOS SDK. Codable support ships inside FirebaseFirestore itself on
  # modern releases (10.11+), so FirebaseFirestoreSwift is intentionally omitted.
  # Pin/bump the `from` version to whatever is current when you first open this
  # in Xcode - Package.resolved will then lock it.
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0

targets:
  JaipurApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: JaipurApp
    resources:
      - path: JaipurApp/Resources/Assets.xcassets
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Jaipur
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kkandenas.jaipur
        PRODUCT_NAME: Jaipur
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: JaipurKit
        product: JaipurKit
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseCore
schemes:
  JaipurApp:
    build:
      targets:
        JaipurApp: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
